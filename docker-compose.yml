version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kitten_empire_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kitten_empire
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: kitten_empire_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/kitten_empire
      BOT_TOKEN: 6530690581:AAGHtC-cN8y3LdlvxDXZyvRCcv7oIgSX2mA
      JWT_SECRET: kitten-empire-secret-key
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: kitten_empire_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
